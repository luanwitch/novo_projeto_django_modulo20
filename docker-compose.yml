version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_password
    ports:
      - "5433:5432"

  web:
    build: .
    # O comando abaixo é o que faz o Django ligar de verdade!
    command: python manage.py runserver 0.0.0.0:8000
    
    volumes:
      - ./novo_projeto_django:/app
    ports:
      - "8001:8000"
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PYTHONPATH=/app
    depends_on:
      - db

volumes:
  postgres_data: